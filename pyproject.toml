[project]
name = "databricks-labs-lakebridge"
description = 'Fast and predictable migrations to Databricks Lakehouse Platform. This tool is designed to help you migrate your data and workloads to the Databricks Lakehouse Platform in a fast, predictable, and reliable way. It provides a set of tools and utilities to help you reconcile your data and workloads, assess your current state, and plan your migration.'
license-files = { paths = ["LICENSE", "NOTICE"] }
keywords = ["Databricks"]
readme = "README.md"
requires-python = ">=3.10.1,<3.14.0"
dynamic = ["version"]
maintainers = [
    { name = "Databricks Labs", email = "labs-oss@databricks.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Utilities",
]

dependencies = [
  "databricks-sdk~=0.85.0",
  "standard-distutils~=3.11.9; python_version>='3.11'",
  "databricks-bb-analyzer~=0.2.2",
  "sqlglot==28.5.0",
  "databricks-labs-blueprint[yaml]>=0.12.0,<0.13.0",
  "databricks-labs-lsql==0.16.0",
  "cryptography>=44.0.2,<46.1.0",
  "pyodbc>=5.2,<5.4",
  "SQLAlchemy~=2.0.40",
  "pygls~=2.0.0",
  "duckdb~=1.2.2",
  "databricks-switch-plugin~=0.1.7",  # Temporary, until Switch is migrated to be a transpiler (LSP) plugin.
  "requests>=2.28.1,<3",  # Matches databricks-sdk (and 'types-requests' below), to avoid conflicts.
  "pandas~=2.3.1", # Required for new configure assessment
]

[project.urls]
Documentation = "https://databrickslabs.github.io/lakebridge"
Issues = "https://github.com/databrickslabs/lakebridge/issues"
Source = "https://github.com/databrickslabs/lakebridge"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]
include = ["src"]

[tool.hatch.version]
path = "src/databricks/labs/lakebridge/__about__.py"

[tool.hatch.envs.default]
python="3.10"

# store virtual env as the child of this folder. Helps VSCode to run better
path = ".venv"

dependencies = [
  "coverage[toml]~=7.10.7",
  "pytest~=8.4.2",
  "pytest-cov~=7.0.0",
  "pytest-asyncio~=1.2.0",
  "pytest-xdist~=3.8.0",
  "pytest-timeout~=2.4.0",
  "black~=25.9.0",
  "ruff~=0.15.0",
  "databricks-connect==15.1",
  "types-requests>=2.28.1,<3",  # Matches the 'requests' above.
  "types-pyYAML~=6.0.12",
  "types-pytz~=2025.2",
  "databricks-labs-pytester>=0.3.0",
  "mypy~=1.18.2",
  "numpy~=1.26.4",
  "pandas-stubs~=2.3.0.250703",
  "cattrs>=25.2.0",
  "faker",
  # Azure SDK dependencies for linting resources/assessments folder
  "azure-identity~=1.19.0",
  "azure-monitor-query~=1.4.0",
  "azure-synapse-artifacts~=0.20.0",
]

[project.entry-points.databricks]
reconcile = "databricks.labs.lakebridge.reconcile.execute:main"
profiler_dashboards = "databricks.labs.lakebridge.assessments.dashboards.execute:main"

[tool.hatch.envs.default.scripts]
test         = "pytest --cov src --cov-report=xml tests/unit"
coverage     = "pytest --cov src tests --cov-report=html --ignore=tests/integration/install --ignore=tests/integration/connections --ignore=tests/integration/assessments"
integration  = "pytest --cov src tests/integration --durations 20"
fmt          = ["black .",
                   "ruff check . --fix",
                   "mypy --disable-error-code 'annotation-unchecked' ."]
verify       = ["black --check .",
                   "ruff check .",
                   "mypy --disable-error-code 'annotation-unchecked' ."]

[tool.hatch.envs.sqlglot-latest]
python="3.10"
dependencies = [
  "databricks-labs-lakebridge",
  "sqlglot",
]


[tool.pytest.ini_options]
addopts = "-s -p no:warnings -vv --cache-clear"
cache_dir = ".venv/pytest-cache"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope="function"

[tool.mypy]
exclude = ["tests/resources/.*"]

[tool.black]
target-version = ["py310"]
line-length = 120
skip-string-normalization = true

# =============================================================================
# Ruff Configuration - Migrated from Pylint + Ruff Hybrid to Ruff-Only
# =============================================================================
# This configuration enables ALL ruff rules with strategic exceptions.
# Justification for each exception is documented inline.
#
# Migration rationale:
# - Simplify toolchain (one linter instead of two)
# - Faster linting (ruff is 10-100x faster than pylint)
# - Modern tooling with better IDE integration
#
# Trade-offs:
# - Loss of 20+ databricks-labs-pylint custom rules (documented in ADR)
# - These will be caught through code review and testing
# =============================================================================

[tool.ruff]
cache-dir = ".venv/ruff-cache"
target-version = "py310"
line-length = 120

extend-exclude = [
  "notebooks/*.py",
  "tests/resources/*",
  "src/databricks/labs/lakebridge/resources/assessments/*"
]

[tool.ruff.lint]
# Enable ALL rules including preview for maximum coverage
select = ["ALL"]
preview = true

ignore = [
  # === Documentation Rules ===
  # Justification: Project doesn't require comprehensive docstrings.
  # Black handles docstring formatting. Team prefers lightweight documentation.
  "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",  # Missing docstrings
  "D200", "D202", "D203", "D204", "D205", "D206", "D207", "D208", "D209", "D210",  # Docstring formatting
  "D211", "D212", "D213", "D214", "D215", "D300", "D301", "D400", "D401", "D402",
  "D403", "D404", "D405", "D406", "D407", "D408", "D409", "D410", "D411", "D412",
  "D413", "D414", "D415", "D416", "D417", "D418", "D419",

  # === DOC Rules (numpy-style docstrings) ===
  # Justification: Project does not enforce numpy-style docstrings
  "DOC",

  # === Formatting Rules ===
  # Justification: Black is the formatter, not ruff
  "E501",   # Line too long (black handles 120 chars)
  "W191", "W291", "W292", "W293",  # Whitespace
  "COM812", "COM819",  # Trailing commas (black handles)
  "ISC001", "ISC002",  # Implicit string concatenation (black handles)

  # === Complexity Rules ===
  # Justification: Existing codebase design allows these limits.
  # Pylint had max-args=12, max-branches=20, max-statements=50, etc.
  "C901",    # McCabe complexity (was allowed in pylint)
  "PLR0911", # Too many return statements (was max 11)
  "PLR0912", # Too many branches (was max 20)
  "PLR0913", # Too many arguments (was max 12)
  "PLR0914", # Too many locals (was max 20)
  "PLR0915", # Too many statements (was max 50)
  "PLR1702", # Too many nested blocks (was max 5)

  # === Security False Positives ===
  # Justification: Data processing code triggers these incorrectly.
  # Safe usage patterns are established in codebase.
  "S105", "S106", "S107",  # Hardcoded passwords (too many false positives)
  "S603", "S608",  # Subprocess/SQL construction (used safely with sqlglot)
  "S311",  # Standard random (not used for cryptography)

  # === Code Style Preferences ===
  # Justification: Acceptable patterns in data engineering context
  "B027",    # Empty methods in abstract classes (intentional protocol)
  "EM101", "EM102",  # Exception string literals (minor style preference)
  "TRY003",  # Raise with vanilla args (relates to EM rules)
  "TRY400", "TRY401",  # Exception/logging verbosity (minor style preference)
  "PLR2004", # Magic value comparisons (acceptable in data processing)
  "PLR6301", # No self use in methods (acceptable in data processing classes)
  "FIX002",  # TODO comments (acceptable for tracking work)
  "TD002", "TD003", "TD004", "TD005",  # TODO formatting requirements (excessive)
  "FBT001", "FBT002", "FBT003",  # Boolean trap rules (acceptable in data processing)
  "G004",    # Logging f-string (acceptable, not a security issue in this context)
  "ARG002", "ARG005",  # Unused arguments (common in interfaces/protocols)
  "DTZ001", "DTZ005",  # Datetime without timezone (data processing timestamps)
  "INP001",  # Implicit namespace package (acceptable project structure)
  "PLC1901", # Compare to empty string (acceptable style)
  "ERA001",  # Commented out code (acceptable during development)
  "PT011", "PT012",  # Pytest style preferences
  "RET504",  # Unnecessary assign before return (acceptable for clarity)
  "N818",    # Error suffix on exception names (not enforced)
  "SIM108",  # Use ternary operator (readability preference)
  "TRY300",  # try-except-else (not always clearer)
  "B008",    # Function call in default argument (acceptable when immutable)
  "PERF203", # try-except in loop (acceptable for error handling)
  "PLW2901", # Redefined loop variable (acceptable when intentional)
  "T201",    # Print statements (acceptable for CLI output and debugging)

  # === Copyright ===
  # Justification: Copyright handled via LICENSE/NOTICE files
  "CPY001",  # Missing copyright notice

  # === Type Annotations ===
  # Justification: MyPy is the primary type checker, not ruff
  "ANN",  # All annotation rules (mypy handles this)

  # === Test-Specific (see per-file-ignores below) ===
  # These are only ignored in test files, not globally
]

# === Complexity Thresholds ===
# Match the limits that were in pylint configuration
[tool.ruff.lint.pylint]
max-args = 12
max-branches = 20
max-locals = 20
max-statements = 50
max-public-methods = 20
max-returns = 11
max-bool-expr = 5
max-nested-blocks = 5
max-positional-args = 12

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]

# Tests have relaxed requirements
"tests/**/*.py" = [
  "S101",     # Assert usage (required by pytest)
  "PLR2004",  # Magic values (tests use literals)
  "ARG001",   # Unused function arguments (pytest fixtures)
  "D",        # All docstring rules
  "TID252",   # Relative imports (allowed in tests)
]

# Coverage utilities are special-purpose measurement code
"src/databricks/labs/lakebridge/coverage/*.py" = ["ALL"]
"tests/unit/coverage/*.py" = ["ALL"]

# LSP protocol requires camelCase naming (protocol specification)
"**/lsp/*.py" = [
  "N802", "N803",  # Function/argument naming (LSP protocol)
  "BLE001",        # Broad exception (intentional in stream handling)
]
"tests/resources/lsp_transpiler/lsp_server.py" = ["N802", "N803"]

# Sqlglot extension requires protected access
"src/databricks/labs/lakebridge/transpiler/sqlglot/parsers/*.py" = [
  "SLF001",  # Protected access (extending sqlglot internals)
]

# Testing internal methods
"tests/unit/transpiler/test_sqlglot_engine.py" = ["SLF001"]

# Upgrade scripts have version numbers in filenames
"src/databricks/labs/lakebridge/upgrades/v*.py" = ["N999"]

# CLI has intentional lazy imports to break cycles
"src/databricks/labs/lakebridge/cli.py" = [
  "PLC0415",  # Import outside toplevel (intentional for circular import breaking)
]

# Editing utilities have specific file handling patterns
"src/databricks/labs/lakebridge/transpiler/lsp/editing.py" = [
  "SIM115",  # Context manager (specific buffering requirements)
]

# Enum auto-generation requires special dunder method
"src/databricks/labs/lakebridge/reconcile/constants.py" = [
  "N807",  # Dunder method naming for enum _generate_next_value_
]


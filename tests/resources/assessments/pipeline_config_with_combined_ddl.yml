name: PipelineWithCombinedDDL
version: "1.0"
steps:
  - name: inventory
    type: sql
    extract_source: assessments/inventory.sql
    ddl_source: assessments/inventory_ddl.sql
    mode: append
    frequency: daily
    flag: active
  - name: usage
    type: sql
    extract_source: assessments/usage.sql
    ddl_source: assessments/usage_ddl.sql
    mode: append
    frequency: weekly
    flag: active

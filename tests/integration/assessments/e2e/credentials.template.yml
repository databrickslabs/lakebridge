# Profiler end-to-end credentials — TEMPLATE (safe to commit; contains NO secrets).
#
# HOW TO USE
#   1. Copy this file and fill in the values for every source you want to exercise.
#   2. Upload the filled copy (plus snowflake.pem / bigquery-sa.json if used) to your Unity
#      Catalog volume — see README.md. Nothing filled is ever committed.
#   3. Locally and in CI, ./setup_e2e_creds.sh downloads them to the default lakebridge path:
#          ~/.databricks/labs/lakebridge/.credentials.yml
#      The profiler reads that default path; each e2e test pulls its section with
#      get_credentials("<source>") and builds the connector with create_connector("<source>", cfg).
#
# NOTE: this is ONE file with a section per source — that is exactly what the credential manager
# reads. secret_vault_type: local => the values below are used verbatim (plain text).
# Never commit the filled file, the Snowflake key, or the BigQuery key.
secret_vault_type: local

# --- Snowflake -------------------------------------------------------------------
# Credentials MUST be nested under "connection". Default auth_type is "pat".
snowflake:
  connection:
    account: ""              # account identifier, e.g. "myorg-myaccount"
    user: ""
    auth_type: pat           # "pat" (default) or "key_pair"
    pat: ""                  # Programmatic Access Token (used when auth_type=pat)
    # --- key-pair auth instead of a PAT (set auth_type: key_pair) ---
    # Upload the key as snowflake.pem; setup_e2e_creds.sh places it next to this file, so:
    # private_key_path: ~/.databricks/labs/lakebridge/snowflake.pem
    # private_key_passphrase: ""   # optional
    warehouse: COMPUTE_WH
    database: SNOWFLAKE
    schema: ACCOUNT_USAGE
    role: ACCOUNTADMIN

# --- Redshift --------------------------------------------------------------------
# Default auth_type is "sql_authentication" (user + password).
redshift:
  auth_type: sql_authentication
  host: ""                   # cluster / serverless workgroup endpoint host
  port: 5439
  database: ""
  ssl: true
  user: ""
  password: ""
  # --- IAM auth instead (set auth_type: iam) ---
  # region: ""
  # aws_profile: ""
  # cluster_identifier: ""
  # db_user: ""

# --- Synapse (dedicated + serverless SQL pools; MSSQL driver) ---------------------
# NESTED under "workspace" + "profiler" — exactly what configure-database-profiler writes and
# what validate_synapse_pools / the profiler pipeline read. A FLAT synapse section fails:
# validate_synapse_pools looks up synapse["workspace"]["dedicated_sql_endpoint"].
# Default auth_type is "SqlPassword" (also ActiveDirectoryPassword /
# ActiveDirectoryServicePrincipal / DefaultAzureCredential — see connections/mssql_auth.py).
synapse:
  workspace:
    name: ""                                # Synapse workspace name
    dedicated_sql_endpoint: ""              # e.g. "<workspace>.sql.azuresynapse.net"
    serverless_sql_endpoint: ""             # e.g. "<workspace>-ondemand.sql.azuresynapse.net"
    development_endpoint: ""                 # e.g. "https://<workspace>.dev.azuresynapse.net"
    auth_type: SqlPassword
    user: ""
    password: ""
    fetch_size: "1000"
    login_timeout: "30"
    tz_info: UTC
  profiler:
    exclude_serverless_sql_pool: false
    exclude_dedicated_sql_pools: false
    exclude_spark_pools: false
    exclude_monitoring_metrics: false
    redact_sql_pools_sql_text: false

# --- Legacy Synapse (dedicated SQL pool; MSSQL driver) ---------------------------
# FLAT section (unlike synapse). The "azure" subdict is REQUIRED: the monitoring_metrics profiler
# step builds an ARM resource id from subscription_id + resource_group and fails the whole run
# without them (the connection test alone does not need it). Default auth_type is "SqlPassword".
legacy_synapse:
  auth_type: SqlPassword
  user: ""
  password: ""
  server: ""                 # e.g. "<workspace>.sql.azuresynapse.net"
  port: 1433
  database: ""               # dedicated pool name
  fetch_size: "1000"
  login_timeout: "30"
  tz_info: UTC
  trust_server_certificate: false   # set true if the server presents a self-signed cert
  azure:
    subscription_id: ""
    resource_group: ""

# --- Oracle ----------------------------------------------------------------------
oracle:
  host: ""
  port: 1521
  service_name: ""
  user: ""
  password: ""

# --- Teradata --------------------------------------------------------------------
teradata:
  host: ""
  port: 1025
  database: ""               # optional default database
  user: ""
  password: ""

# --- BigQuery --------------------------------------------------------------------
# Auth is NOT in this file: point GOOGLE_APPLICATION_CREDENTIALS at a service-account JSON key.
# Upload that key as bigquery-sa.json; setup_e2e_creds.sh downloads it and wires the env var.
bigquery:
  pairs:
    - project: ""
      region: ""

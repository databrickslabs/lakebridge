# Profiler end-to-end credentials — TEMPLATE (safe to commit; contains NO secrets).
#
# HOW TO USE
#   1. Copy this file and fill in the values for every source you want to exercise.
#   2. Save the filled copy as your lakebridge credentials file (git-ignored via ".credentials.*"):
#          ~/.databricks/labs/lakebridge/.credentials.yml
#      The profiler reads that default path; each e2e test pulls its section with
#      get_credentials("<source>") and builds the connector with create_connector("<source>", cfg).
#   3. Bundle it into the single CI secret with ./bundle_credentials.sh  (see README.md).
#
# NOTE: this is ONE file with a section per source — that is exactly what the credential manager
# reads. (If you specifically want 7 separate physical files instead, say so; the tests would then
# each need a custom creds_path. One combined file keeps the single-secret bundle a one-liner.)
#
# secret_vault_type: local  => the values below are used verbatim (plain text).
# Never commit the filled file.
secret_vault_type: local

# --- Snowflake -------------------------------------------------------------------
# Credentials MUST be nested under "connection". Default auth_type is "pat".
snowflake:
  connection:
    account: ""              # account identifier, e.g. "myorg-myaccount"
    user: ""
    auth_type: pat           # "pat" (default) or "key_pair"
    pat: ""                  # Programmatic Access Token (used when auth_type=pat)
    # --- key-pair auth instead of a PAT (set auth_type: key_pair) ---
    # private_key_path: ""
    # private_key_passphrase: ""   # optional
    warehouse: COMPUTE_WH
    database: SNOWFLAKE
    schema: ACCOUNT_USAGE
    role: ACCOUNTADMIN

# --- Redshift --------------------------------------------------------------------
# Default auth_type is "sql_authentication" (user + password).
redshift:
  auth_type: sql_authentication
  host: ""                   # cluster / serverless workgroup endpoint host
  port: 5439
  database: ""
  ssl: true
  user: ""
  password: ""
  # --- IAM auth instead (set auth_type: iam) ---
  # region: ""
  # aws_profile: ""
  # cluster_identifier: ""
  # db_user: ""

# --- Synapse (dedicated SQL pool; MSSQL driver) ----------------------------------
# Default auth_type is "SqlPassword". Other modes: ActiveDirectoryPassword,
# ActiveDirectoryServicePrincipal, DefaultAzureCredential (see connections/mssql_auth.py).
synapse:
  server: ""                 # e.g. "<workspace>.sql.azuresynapse.net"
  port: 1433
  database: ""
  auth_type: SqlPassword
  user: ""
  password: ""
  trust_server_certificate: false

# --- Legacy Synapse (SQL Server family; MSSQL driver) ----------------------------
legacy_synapse:
  server: ""
  port: 1433
  database: ""
  auth_type: SqlPassword
  user: ""
  password: ""
  trust_server_certificate: false

# --- Oracle ----------------------------------------------------------------------
oracle:
  host: ""
  port: 1521
  service_name: ""
  user: ""
  password: ""

# --- Teradata --------------------------------------------------------------------
teradata:
  host: ""
  port: 1025
  database: ""               # optional default database
  user: ""
  password: ""

# --- BigQuery --------------------------------------------------------------------
# Auth is NOT in this file: point GOOGLE_APPLICATION_CREDENTIALS at a service-account
# JSON key. Bundle that key as bigquery-sa.json alongside this file (see README.md).
bigquery:
  pairs:
    - project: ""
      region: ""

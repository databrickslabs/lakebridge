secret_vault_type: local | databricks | env | aws_secrets_manager
secret_vault_name: null

# Required when secret_vault_type: aws_secrets_manager
aws_secrets_manager:
  region_name: us-east-1   # optional; falls back to AWS_DEFAULT_REGION / instance profile
  profile_name: null        # optional AWS CLI named profile
  assume_role_arn: null     # optional IAM role ARN to assume
snowflake:
  account: example_account
  connect_retries: 1
  connect_timeout: null
  host: null
  insecure_mode: false
  oauth_client_id: null
  oauth_client_secret: null
  password: null
  port: null
  private_key: null
  private_key_passphrase: null
  private_key_path: null
  role: null
  token: null
  user: null
  warehouse: null

redshift:
  # auth_type: sql_authentication | iam | secrets_manager
  auth_type: sql_authentication
  host: example-cluster.abc123xyz789.us-east-1.redshift.amazonaws.com
  port: 5439
  database: dev
  ssl: true
  # sql_authentication fields:
  user: null
  password: null
  # iam fields (auth_type: iam):
  # cluster_identifier: null
  # db_user: null
  # region: null
  # profile: null
  # secrets_manager fields (auth_type: secrets_manager):
  # secret_arn: null
  # region: null

mssql:
  #TODO Expand to support sqlpools, and legacy dwh
  database: DB_NAME
  driver: ODBC Driver 18 for SQL Server
  server: example_host
  port: null
  user: null
  password: null






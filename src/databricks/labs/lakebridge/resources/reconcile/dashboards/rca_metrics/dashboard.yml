display_name: "Reconciliation RCA"
tiles:
  05_1_run_details:
    overrides:
      spec:
        version: 2
        widgetType: table
        encodings:
          columns:
            - fieldName: recon_id
              displayName: Recon ID
            - fieldName: target_table
              displayName: Table
            - fieldName: status_label
              displayName: Status
            - fieldName: start_ts
              displayName: Started At
            - fieldName: mismatched_rows
              displayName: Mismatched Rows
            - fieldName: missing_in_source
              displayName: Missing in Source
            - fieldName: missing_in_target
              displayName: Missing in Target
            - fieldName: failing_columns
              displayName: Failing Columns
            - fieldName: executed_by
              displayName: Executed By
            - fieldName: source_table
              displayName: Source Table
            - fieldName: source_type
              displayName: Source Type
            - fieldName: end_ts
              displayName: Ended At
      queries:
        - name: main_query
          query:
            datasetName: 05_1_run_details
            fields:
              - name: recon_id
                expression: '`recon_id`'
              - name: target_table
                expression: '`target_table`'
              - name: status_label
                expression: '`status_label`'
              - name: start_ts
                expression: '`start_ts`'
              - name: mismatched_rows
                expression: '`mismatched_rows`'
              - name: missing_in_source
                expression: '`missing_in_source`'
              - name: missing_in_target
                expression: '`missing_in_target`'
              - name: failing_columns
                expression: '`failing_columns`'
              - name: executed_by
                expression: '`executed_by`'
              - name: source_table
                expression: '`source_table`'
              - name: source_type
                expression: '`source_type`'
              - name: end_ts
                expression: '`end_ts`'
            disaggregated: true
  05_0_jobs_summary:
    overrides:
      spec:
        version: 2
        widgetType: table
        encodings:
          columns:
            - fieldName: recon_id
              displayName: Recon ID
            - fieldName: start_ts
              displayName: Started At
            - fieldName: tables
              displayName: Tables in Batch
            - fieldName: succeeded
              displayName: Succeeded Tables
            - fieldName: failed
              displayName: Failed Tables
            - fieldName: mismatched_rows
              displayName: Mismatched Rows
            - fieldName: missing_rows
              displayName: Missing Rows
      queries:
        - name: main_query
          query:
            datasetName: 05_0_jobs_summary
            fields:
              - name: recon_id
                expression: '`recon_id`'
              - name: start_ts
                expression: '`start_ts`'
              - name: tables
                expression: '`tables`'
              - name: succeeded
                expression: '`succeeded`'
              - name: failed
                expression: '`failed`'
              - name: mismatched_rows
                expression: '`mismatched_rows`'
              - name: missing_rows
                expression: '`missing_rows`'
            disaggregated: true
  09_1_job_timeline:
    overrides:
      spec:
        version: 3
        widgetType: bar
        mark:
          layout: group
        encodings:
          x:
            fieldName: hourly(start_ts)
            scale:
              type: temporal
            displayName: Time
          'y':
            fields:
              - fieldName: sum(succeeded)
                displayName: Succeeded
              - fieldName: sum(failed)
                displayName: Failed
            scale:
              type: quantitative
            displayName: Table Runs
          label:
            show: false
      queries:
        - name: main_query
          query:
            datasetName: 09_1_job_timeline
            fields:
              - name: hourly(start_ts)
                expression: 'DATE_TRUNC("HOUR", `start_ts`)'
              - name: sum(succeeded)
                expression: 'SUM(`succeeded`)'
              - name: sum(failed)
                expression: 'SUM(`failed`)'
            disaggregated: false
  07_0_total_runs:
    overrides:
      spec:
        version: 2
        widgetType: counter
        encodings:
          value:
            fieldName: count(*)
            displayName: Total Runs
      queries:
        - name: main_query
          query:
            datasetName: 07_0_total_runs
            fields:
              - name: count(*)
                expression: 'COUNT(*)'
            disaggregated: false
  07_1_successful_runs:
    overrides:
      spec:
        version: 2
        widgetType: counter
        encodings:
          value:
            fieldName: count(*)
            displayName: Successful Runs
      queries:
        - name: main_query
          query:
            datasetName: 07_1_successful_runs
            fields:
              - name: count(*)
                expression: 'COUNT(*)'
            disaggregated: false
  07_2_failed_runs:
    overrides:
      spec:
        version: 2
        widgetType: counter
        encodings:
          value:
            fieldName: count(*)
            displayName: Failed Runs
      queries:
        - name: main_query
          query:
            datasetName: 07_2_failed_runs
            fields:
              - name: count(*)
                expression: 'COUNT(*)'
            disaggregated: false
  08_0_failed_tables:
    overrides:
      spec:
        version: 2
        widgetType: counter
        encodings:
          value:
            fieldName: countdistinct(target_table)
            displayName: Distinct Failed Tables
      queries:
        - name: main_query
          query:
            datasetName: 08_0_failed_tables
            fields:
              - name: countdistinct(target_table)
                expression: 'COUNT(DISTINCT `target_table`)'
            disaggregated: false
  08_1_row_differences:
    overrides:
      spec:
        version: 2
        widgetType: counter
        encodings:
          value:
            fieldName: sum(diff_rows)
            displayName: Failed Rows
      queries:
        - name: main_query
          query:
            datasetName: 08_1_row_differences
            fields:
              - name: sum(diff_rows)
                expression: 'SUM(`diff_rows`)'
            disaggregated: false
  08_2_successful_tables:
    overrides:
      spec:
        version: 2
        widgetType: counter
        encodings:
          value:
            fieldName: countdistinct(target_table)
            displayName: Distinct Successful Tables
      queries:
        - name: main_query
          query:
            datasetName: 08_2_successful_tables
            fields:
              - name: countdistinct(target_table)
                expression: 'COUNT(DISTINCT `target_table`)'
            disaggregated: false
  10_0_failures_by_table:
    overrides:
      spec:
        version: 3
        widgetType: pie
        encodings:
          angle:
            fieldName: sum(mismatched_rows + missing_rows)
            scale:
              type: quantitative
            displayName: Failed Rows
          color:
            fieldName: target_table
            scale:
              type: categorical
            displayName: Table
          label:
            show: true
      queries:
        - name: main_query
          query:
            datasetName: 10_0_failures_by_table
            fields:
              - name: target_table
                expression: '`target_table`'
              - name: sum(mismatched_rows + missing_rows)
                expression: 'SUM(`mismatched_rows` + `missing_rows`)'
            disaggregated: false
  10_1_successes_by_table:
    overrides:
      spec:
        version: 3
        widgetType: pie
        encodings:
          angle:
            fieldName: count(*)
            scale:
              type: quantitative
            displayName: Successful Runs
          color:
            fieldName: target_table
            scale:
              type: categorical
            displayName: Table
          label:
            show: true
      queries:
        - name: main_query
          query:
            datasetName: 10_1_successes_by_table
            fields:
              - name: target_table
                expression: '`target_table`'
              - name: count(*)
                expression: 'COUNT(*)'
            disaggregated: false
  09_2_mismatch_trend:
    overrides:
      spec:
        version: 3
        widgetType: bar
        mark:
          layout: group
        encodings:
          x:
            fieldName: hourly(start_ts)
            scale:
              type: temporal
            displayName: Time
          'y':
            fields:
              - fieldName: sum(mismatched)
                displayName: Mismatched
              - fieldName: sum(missing_in_source)
                displayName: Missing in Source
              - fieldName: sum(missing_in_target)
                displayName: Missing in Target
            scale:
              type: quantitative
            displayName: Failed Rows
          label:
            show: false
      queries:
        - name: main_query
          query:
            datasetName: 09_2_mismatch_trend
            fields:
              - name: hourly(start_ts)
                expression: 'DATE_TRUNC("HOUR", `start_ts`)'
              - name: sum(mismatched)
                expression: 'SUM(`mismatched`)'
              - name: sum(missing_in_source)
                expression: 'SUM(`missing_in_source`)'
              - name: sum(missing_in_target)
                expression: 'SUM(`missing_in_target`)'
            disaggregated: false

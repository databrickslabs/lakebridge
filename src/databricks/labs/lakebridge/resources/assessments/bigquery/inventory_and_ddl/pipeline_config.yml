name: bigquery_assessment_inventory_and_ddl
version: "1.0"
# Default / recommended variant: inventory (sizing, workload) plus object-definition DDL extracts.
# Object definitions include recreation DDL and routine bodies — treat the DuckDB output as sensitive.
steps:
  - name: bq_inventory_extract
    type: python
    extract_source: src/databricks/labs/lakebridge/resources/assessments/bigquery/bq_inventory_extract.py
    mode: overwrite
    frequency: once
    flag: active
  - name: bq_definitions_extract
    type: python
    extract_source: src/databricks/labs/lakebridge/resources/assessments/bigquery/bq_definitions_extract.py
    mode: overwrite
    frequency: once
    flag: active

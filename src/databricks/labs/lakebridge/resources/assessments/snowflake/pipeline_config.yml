name: snowflake_assessment
version: "1.0"
steps:
  - name: account_info
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/account_info.sql
    mode: overwrite
    frequency: once
    flag: active

  - name: database_objects
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/database_objects.sql
    mode: overwrite
    frequency: once
    flag: active

  - name: warehouse_usage
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/warehouse_usage.sql
    mode: overwrite
    frequency: daily
    flag: active

  # Bounded RANDOM sample of query history (incl. QUERY_TEXT) for workload
  # classification. Replaces the unbounded 90-day full-text pull that produced
  # multi-GB extracts on high-volume accounts (issue #2532).
  - name: query_history
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/query_history.sql
    mode: overwrite
    frequency: daily
    flag: active

  # Top-N most expensive queries (with QUERY_TEXT) so the random sample never
  # misses the outliers that drive a large share of spend.
  - name: query_history_top
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/query_history_top.sql
    mode: overwrite
    frequency: daily
    flag: active

  # Full-window aggregate (no query text): true totals + per-group distribution
  # and percentiles the downstream skill applies the sampled category mix against.
  - name: query_history_stats
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/query_history_stats.sql
    mode: overwrite
    frequency: daily
    flag: active

  - name: storage_usage
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/storage_usage.sql
    mode: overwrite
    frequency: daily
    flag: active

  # Background-service usage tables. Optional because accounts that don't use
  # these features won't have rows; missing categories cleanly degrade to zero.
  - name: pipe_usage
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/pipe_usage.sql
    mode: overwrite
    frequency: daily
    flag: active

  - name: automatic_clustering
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/automatic_clustering.sql
    mode: overwrite
    frequency: daily
    flag: active

  - name: materialized_view_refresh
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/materialized_view_refresh.sql
    mode: overwrite
    frequency: daily
    flag: active

  # Effective rate per credit/unit and the account tier (SERVICE_LEVEL). Requires
  # SNOWFLAKE.ORGANIZATION_USAGE access (ACCOUNTADMIN in an ORGADMIN-enabled account).
  # Feeds the downstream TCO model.
  - name: rate_sheet
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/rate_sheet.sql
    mode: overwrite
    frequency: once
    flag: active

name: snowflake_assessment
version: "1.0"
steps:
  - name: account_info
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/account_info.sql
    ddl_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/account_info_ddl.sql
    mode: overwrite
    frequency: once
    flag: active

  - name: database_objects
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/database_objects.sql
    ddl_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/database_objects_ddl.sql
    mode: overwrite
    frequency: once
    flag: active

  - name: warehouse_usage
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/warehouse_usage.sql
    ddl_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/warehouse_usage_ddl.sql
    mode: overwrite
    frequency: daily
    flag: active

  - name: query_history
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/query_history.sql
    ddl_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/query_history_ddl.sql
    mode: overwrite
    frequency: daily
    flag: active

  # Bounded SQL-text sample for downstream heuristics (migration_complexity).
  # Full query_history omits QUERY_TEXT to bound extract size.
  - name: query_samples
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/query_samples.sql
    ddl_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/query_samples_ddl.sql
    mode: overwrite
    frequency: daily
    flag: active

  - name: storage_usage
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/storage_usage.sql
    ddl_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/storage_usage_ddl.sql
    mode: overwrite
    frequency: daily
    flag: active

  # Background-service usage tables. Optional because accounts that don't use
  # these features won't have rows; missing categories cleanly degrade to zero.
  - name: pipe_usage
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/pipe_usage.sql
    ddl_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/pipe_usage_ddl.sql
    mode: overwrite
    frequency: daily
    flag: active

  - name: automatic_clustering
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/automatic_clustering.sql
    ddl_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/automatic_clustering_ddl.sql
    mode: overwrite
    frequency: daily
    flag: active

  - name: materialized_view_refresh
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/materialized_view_refresh.sql
    ddl_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/materialized_view_refresh_ddl.sql
    mode: overwrite
    frequency: daily
    flag: active

  # Effective rate per credit/unit and the account tier (SERVICE_LEVEL). Requires
  # SNOWFLAKE.ORGANIZATION_USAGE access (ACCOUNTADMIN in an ORGADMIN-enabled account).
  # Feeds the downstream TCO model.
  - name: rate_sheet
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/rate_sheet.sql
    ddl_source: src/databricks/labs/lakebridge/resources/assessments/snowflake/rate_sheet_ddl.sql
    mode: overwrite
    frequency: once
    flag: active

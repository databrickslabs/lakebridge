name: synapse_assessment
version: "1.0"
extract_folder: "~/.databricks/labs/lakebridge_profilers/synapse_assessment"
steps:
  - name: workspace_info
    type: python
    extract_source: src/databricks/labs/lakebridge/resources/assessments/synapse/workspace_extract.py
    mode: overwrite
    frequency: once
    flag: active
    dependencies:
      - azure-synapse-artifacts
      - azure-identity
      - azure-monitor-query==1.3.0b1
  - name: monitoring_metrics
    type: python
    extract_source: src/databricks/labs/lakebridge/resources/assessments/synapse/monitoring_metrics_extract.py
    mode: overwrite
    frequency: once
    flag: active
    dependencies:
      - azure-synapse-artifacts
      - azure-identity
      - azure-monitor-query==1.3.0b1
  - name: dedicated_sqlpool_extract
    type: python
    extract_source: src/databricks/labs/lakebridge/resources/assessments/synapse/dedicated_sqlpool_extract.py
    mode: overwrite
    frequency: once
    flag: active
    dependencies:
      - azure-synapse-artifacts
      - azure-identity
      - azure-monitor-query==1.3.0b1
  - name: serverless_sqlpool_extract
    type: python
    extract_source: src/databricks/labs/lakebridge/resources/assessments/synapse/serverless_sqlpool_extract.py
    mode: overwrite
    frequency: once
    flag: active
    dependencies:
      - azure-synapse-artifacts
      - azure-identity
      - azure-monitor-query==1.3.0b1

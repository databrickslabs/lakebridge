name: clickhouse_assessment_oss
version: "1.0"

# Self-managed / OSS variant. Paired ddl+sql profiler steps: the ddl creates the typed DuckDB
# table, the sql reads system.* on the source. Steps that read per-node log tables (query_log,
# session_log, query_views_log, asynchronous_insert_log) are marked optional so a build without
# them degrades to ABSENT rather than failing the run. Replicated-metadata SQL is shared from the
# clickhouse/ root; log-table SQL lives under oss/ (read directly, no clusterAllReplicas).
steps:
  - name: objects_databases
    type: ddl
    extract_source: src/databricks/labs/lakebridge/resources/assessments/clickhouse/objects_databases_ddl.sql
    mode: overwrite
    frequency: once
    flag: active

name: redshift_assessment
version: "1.0"
steps:
  - name: drop_query_view
    type: source_ddl
    extract_source: src/databricks/labs/lakebridge/resources/assessments/redshift/sql/0_drop_query_view.sql
    mode: overwrite
    frequency: once
    flag: active
  - name: query_view
    type: source_ddl
    extract_source: src/databricks/labs/lakebridge/resources/assessments/redshift/sql/0_query_view.sql
    mode: overwrite
    frequency: once
    flag: active
  - name: rs_spectrum_tb_month
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/redshift/sql/1_rs_spectrum_tb_month.sql
    mode: overwrite
    frequency: once
    flag: active
  # Provisioned single-AZ storage (stv_node_storage_capacity). Absent on serverless / multi-AZ.
  - name: rs_managed_storage_gb
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/redshift/sql/2_rs_managed_storage_gb_stv.sql
    mode: overwrite
    frequency: once
    flag: active
    optional: true
  # Serverless storage (sys_serverless_usage). Absent on provisioned clusters.
  - name: rs_managed_storage_gb
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/redshift/sql/2_rs_managed_storage_gb_serverless.sql
    mode: overwrite
    frequency: once
    flag: active
    optional: true
  # Provisioned single-AZ nodes (stv_partitions). Absent on serverless / multi-AZ.
  - name: rs_nodes
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/redshift/sql/3_rs_nodes_stv.sql
    mode: overwrite
    frequency: once
    flag: active
    optional: true
  # Serverless nodes / RPU capacity (sys_serverless_usage). Absent on provisioned clusters.
  - name: rs_nodes
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/redshift/sql/3_rs_nodes_serverless.sql
    mode: overwrite
    frequency: once
    flag: active
    optional: true
  - name: rs_avg_concurrent_users
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/redshift/sql/4_rs_avg_concurrent_users.sql
    mode: overwrite
    frequency: once
    flag: active
  - name: rs_avg_queries_minute
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/redshift/sql/5_rs_avg_queries_minute.sql
    mode: overwrite
    frequency: once
    flag: active
  - name: chart_query_type_by_hour
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/redshift/sql/6_chart_query_type_by_hour.sql
    mode: overwrite
    frequency: once
    flag: active
  - name: chart_cpu_consumption_by_query_type
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/redshift/sql/7_chart_cpu_consumption_by_query_type.sql
    mode: overwrite
    frequency: once
    flag: active
  - name: chart_concurrent_users_by_hour
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/redshift/sql/8_chart_concurrent_users_by_hour.sql
    mode: overwrite
    frequency: once
    flag: active
  - name: chart_cpu_consumption_by_hour_and_query_type
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/redshift/sql/9_chart_cpu_consumption_by_hour_and_query_type.sql
    mode: overwrite
    frequency: once
    flag: active
  # Serverless-only cost. Absent on provisioned clusters.
  - name: cost_incurred
    type: sql
    extract_source: src/databricks/labs/lakebridge/resources/assessments/redshift/sql/10_cost_incurred.sql
    mode: overwrite
    frequency: once
    flag: active
    optional: true

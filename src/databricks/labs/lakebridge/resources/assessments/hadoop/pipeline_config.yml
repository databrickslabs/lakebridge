    flag: active
    optional: true

  - name: impala_daemon_config
    type: python
    extract_source: src/databricks/labs/lakebridge/resources/assessments/hadoop/impala_daemon_config.py
    mode: overwrite
    frequency: once
    flag: active
    optional: true

  # The catalogd and statestore steps also need hadoop.impala.catalogd_url or statestored_url.
  - name: impala_catalog
    type: python
    extract_source: src/databricks/labs/lakebridge/resources/assessments/hadoop/impala_catalog.py
    mode: overwrite
    frequency: once
    flag: active
    optional: true

  - name: impala_statestore
    type: python
    extract_source: src/databricks/labs/lakebridge/resources/assessments/hadoop/impala_statestore.py
    mode: overwrite
    frequency: once
    flag: active
    optional: true
